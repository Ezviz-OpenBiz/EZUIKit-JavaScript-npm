# Dependabot 依赖更新配置
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 主项目 pnpm-lock.yaml（workspace 根）
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # js-yaml 3.x 系列 upstream 已停止维护（3.x 最高版本 3.14.1）
      # 安全通告标注的 3.15.0 在 npm 上不存在，Dependabot 无法自动升级
      # 修复漏洞需要 major bump 到 4.x，且只影响老 examples/with-vue2.5（已从 workspace 排除）
      - dependency-name: 'js-yaml'
        versions: ['3.x']

  # 老的 vue2.5 示例（yarn，不参与主构建，仅历史遗留）
  # 单独列出用最低频率扫描，只允许 major 更新（避免每周被 patch 打扰）
  - package-ecosystem: 'npm'
    directory: '/examples/with-vue2.5'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0 # 不主动创建 PR，只做安全告警
    ignore:
      - dependency-name: 'js-yaml'
        versions: ['3.x']
