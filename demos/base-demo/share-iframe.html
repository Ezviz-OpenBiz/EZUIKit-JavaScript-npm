<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <title>视频分享 iframe Demo</title>
    <script src="./ezuikit.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #player {
        width: 100%;
      }
      @media (max-width: 820px) {
        #player {
          width: 100vw;
          height: 56.25vw;
          overflow: hidden;
        }
      }
      @media (min-width: 821px) {
        body {
          display: flex;
          justify-content: center;
          align-items: center;
        }
        #player {
          width: 800px;
          height: 450px;
        }
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      /**
       * 视频分享 iframe 示例
       *
       * 使用方式：
       * 1. 将本文件及 ezuikit.js、ezuikit_static 部署到你自己的服务器
       * 2. 由你的后端接口动态下发 url、accessToken、playbackRange（避免暴露在前端源码中）
       * 3. 在需要嵌入的页面通过 <iframe src="https://your-server/share-iframe.html?params..."> 引用
       *
       * 下面演示从 URL 参数中读取配置（实际项目建议改为从后端接口获取）
       */
      var params = new URLSearchParams(window.location.search);
      var url = params.get('url') || '';
      var accessToken = params.get('accessToken') || '';
      var begin = params.get('begin') || '';
      var end = params.get('end') || '';

      if (!url || !accessToken) {
        document.getElementById('player').innerHTML =
          '<p style="color:#fff;text-align:center;padding:40px;">缺少参数：请通过 URL 传入 url、accessToken（以及可选的 begin、end）</p>';
      } else {
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || document.documentElement.clientWidth <= 820;

        var options = {
          id: 'player',
          url: url,
          accessToken: accessToken,
          staticPath: './ezuikit_static',

          width: isMobile ? document.documentElement.clientWidth : 800,
          height: isMobile ? (document.documentElement.clientWidth * 9) / 16 : 450,
          language: 'zh',

          // themeData 自定义工具栏（精简版，适合嵌入场景）
          themeData: {
            autoFocus: 0,
            header: {
              btnList: [{ iconId: 'recDropdown', part: 'right', isrender: 1 }],
            },
            footer: {
              btnList: [
                { iconId: 'play', part: 'left', isrender: 1 },
                { iconId: 'sound', part: 'left', isrender: 1 },
                { iconId: 'expend', part: 'right', isrender: 1 },
              ],
            },
          },

          // 移动端扩展：时间轴 + 片段进度条
          mobileExtendOptions: isMobile ? { controls: ['timeLine', 'segmentProgress'] } : null,

          // 关闭不需要的控件（嵌入场景精简 UI）
          dateOptions: null,
          ptzOptions: null,
          talkOptions: null,
          recListOptions: null,
          recordOptions: null,
          capturePictureOptions: null,
          definitionOptions: null,
          deviceOptions: null,
          globalFullscreenOptions: null,
          alarmMessageOptions: null,
          dblClickFullscreen: false,
        };

        // 播放区间（可选）—— 限制回放只能在该时间范围内播放
        if (begin && end) {
          options.playbackRange = { begin: begin, end: end };
        }

        var player = new EZUIKit.EZUIKitPlayer(options);

        // 监听播放区间结束事件
        player.on('playbackEnd', function (data) {
          console.log('播放区间结束', data.reason, data.range);
        });
      }
    </script>
  </body>
</html>
