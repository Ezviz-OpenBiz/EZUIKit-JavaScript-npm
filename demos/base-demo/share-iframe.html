<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <title>视频分享 iframe Demo</title>
    <script src="./ezuikit.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #player {
        width: 100%;
      }
      @media (max-width: 820px) {
        #player {
          width: 100vw;
          height: 56.25vw;
          overflow: hidden;
        }
      }
      @media (min-width: 821px) {
        body {
          display: flex;
          justify-content: center;
          align-items: center;
        }
        #player {
          width: 800px;
          height: 450px;
        }
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || document.documentElement.clientWidth <= 820;

      var options = {
        id: 'player',
        url: 'ezopen://open.ys7.com/BC7799091/1.rec?begin=20260819000000&end=20260819235959',
        accessToken: 'at.5awql42c05qjvf6o1w99c5oe2apcsr2i-3k8qwlkm81-0q940hl-rfd1e6al4',
        staticPath: './ezuikit_static',

        // 播放区间（片段分享）
        playbackRange: {
          begin: '20260819103500',
          end: '20260819104500',
        },

        width: isMobile ? document.documentElement.clientWidth : 800,
        height: isMobile ? (document.documentElement.clientWidth * 9) / 16 : 450,
        language: 'zh',

        // themeData 自定义工具栏
        themeData: {
          autoFocus: 0,
          header: {
            btnList: [{ iconId: 'recDropdown', part: 'right', isrender: 1 }],
          },
          footer: {
            btnList: [
              { iconId: 'play', part: 'left', isrender: 1 },
              { iconId: 'sound', part: 'left', isrender: 1 },
              { iconId: 'expend', part: 'right', isrender: 1 },
            ],
          },
        },

        // 移动端扩展
        mobileExtendOptions: isMobile ? { controls: ['timeLine', 'segmentProgress'] } : null,

        // 关闭不需要的独立控件
        dateOptions: null,
        ptzOptions: null,
        talkOptions: null,
        recListOptions: null,
        recordOptions: null,
        capturePictureOptions: null,
        definitionOptions: null,
        deviceOptions: null,
        globalFullscreenOptions: null,
        alarmMessageOptions: null,
        dblClickFullscreen: false,
      };

      var player = new EZUIKit.EZUIKitPlayer(options);

      player.on('playbackEnd', function (data) {
        console.log('playbackEnd', data);
      });

      // ====== 测试：观察 FirstFrameCallBack 和 RunTimeInfoCallBackEx ======
      var testSeekCount = 0;
      var lastAbsTimeSec = 0;

      player.on('firstFrameDisplay', function () {
        console.log('%c[TEST] firstFrameDisplay 触发', 'color: #00ff00; font-weight: bold');
      });

      // 等播放器初始化完成后挂钩子
      setTimeout(function () {
        var enginePlayer = player.jSPlugin && player.jSPlugin.player;
        if (!enginePlayer) {
          console.warn('[TEST] 未找到 enginePlayer，稍后重试...');
          return;
        }

        // 监听引擎层的 firstFrameCallback
        enginePlayer.on('EVENT_CALLBACK', function (result) {
          if (result && result.data && result.data.type === 'firstFrameCallback') {
            console.log('%c[TEST] 引擎 firstFrameCallback 触发, decodeEngine=' + result.data.decodeEngine, 'color: #00ff00; font-weight: bold');
          }
        });

        // 包装 RunTimeInfoCallBackEx —— 监听 AbsTime 字段
        // 引擎层已经注册了这个回调，我们通过 monkey-patch 来观察
        var originalEmit = enginePlayer.emit.bind(enginePlayer);
        var absTimeLogCount = 0;
        var absTimeLogThrottle = 0;

        enginePlayer.on('EVENT_CALLBACK', function (result) {
          if (result && result.data && result.data.type === 'setRunTimeInfoCallBack') {
            var info = result.data.data && result.data.data.pstRuntimeInfo;
            if (info) {
              var now = Date.now();
              // 检查 AbsTime 字段
              var hasAbsTime = info.AbsTimeYear && info.AbsTimeYear > 0;
              var absSec = 0;
              if (hasAbsTime) {
                absSec = new Date(info.AbsTimeYear, info.AbsTimeMonth - 1, info.AbsTimeDay, info.AbsTimeHour, info.AbsTimeMinute, info.AbsTimeSecond).getTime() / 1000;
              }

              // 每 2 秒打印一次，避免刷屏
              if (now - absTimeLogThrottle > 2000) {
                absTimeLogThrottle = now;
                console.log('[TEST] RunTimeInfoCB | errorCode=0x' + (info.nErrorCode || 0).toString(16) +
                  ' | AbsTime=' + (hasAbsTime ? (info.AbsTimeYear + '-' + info.AbsTimeMonth + '-' + info.AbsTimeDay + ' ' + info.AbsTimeHour + ':' + info.AbsTimeMinute + ':' + info.AbsTimeSecond + '.' + (info.AbsTimeMilliseconds || 0)) : '无') +
                  ' | absSec=' + absSec +
                  ' | frameNum=' + info.nFrameNum +
                  ' | avgDecTime=' + info.nAverageDecodeTime + 'ms');
              }

              // 秒值变化时打印（模拟 osdTick）
              if (hasAbsTime && absSec !== lastAbsTimeSec && lastAbsTimeSec > 0) {
                console.log('%c[TEST] AbsTime 秒跳变: ' + lastAbsTimeSec + ' → ' + absSec + ' (差' + (absSec - lastAbsTimeSec) + '秒)', 'color: #ff9900');
              }
              if (hasAbsTime && absSec > 0) {
                lastAbsTimeSec = absSec;
              }
            }
          }
        });

        console.log('%c[TEST] 测试钩子已挂载。播放后观察日志，然后拖动时间轴触发 seek。', 'color: #00ccff; font-weight: bold');
        console.log('[TEST] 观察点：');
        console.log('  1. seek 后 firstFrameCallback 是否再次触发');
        console.log('  2. RunTimeInfoCB 的 AbsTime 字段是否有值');
        console.log('  3. seek 后 AbsTime 是否跳变到新位置');

        // 暴露一个手动 seek 方法方便控制台测试
        window.testSeek = function (seconds) {
          seconds = seconds || 30;
          var currentOsd = enginePlayer.getOSDTime();
          var targetDate = new Date((currentOsd + seconds) * 1000);
          var fmt = function (n) { return n < 10 ? '0' + n : '' + n; };
          var begin = '' + targetDate.getFullYear() + fmt(targetDate.getMonth() + 1) + fmt(targetDate.getDate()) + fmt(targetDate.getHours()) + fmt(targetDate.getMinutes()) + fmt(targetDate.getSeconds());
          console.log('%c[TEST] 手动 seek → ' + begin + ' (当前OSD +' + seconds + '秒)', 'color: #ff00ff; font-weight: bold');
          console.log('[TEST] seek 前 AbsTimeSec = ' + lastAbsTimeSec);
          testSeekCount++;
          player.seek(begin);
        };
        console.log('[TEST] 控制台输入 testSeek(30) 可向前跳 30 秒');
      }, 5000);
    </script>
    </script>
  </body>
</html>
