<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <title>视频分享 iframe Demo</title>
    <script src="./ezuikit.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #player {
        width: 100%;
      }
      @media (max-width: 820px) {
        #player {
          width: 100vw;
          height: 56.25vw;
          overflow: hidden;
        }
      }
      @media (min-width: 821px) {
        body {
          display: flex;
          justify-content: center;
          align-items: center;
        }
        #player {
          width: 800px;
          height: 450px;
        }
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      /**
       * 视频分享 iframe 示例
       *
       * 本页面演示如何创建一个可被 iframe 嵌入的视频分享播放页。
       *
       * 安全要点：
       * - accessToken、播放地址、播放区间等敏感信息不应硬编码在前端，也不应通过 URL 参数传递
       * - 推荐做法：部署此页面到你自己的服务器，通过你自己的后端 API 下发播放配置
       * - 后端根据分享 ID 鉴权后返回 url、accessToken、playbackRange，前端拿到后初始化播放器
       *
       * 使用方式：
       * 1. 参考本文件改造，将 fetchShareConfig() 替换为调用你自己的后端接口
       * 2. 将改造后的页面与 ezuikit.js、ezuikit_static 一起部署到你的服务器
       * 3. 在需要嵌入的页面通过 <iframe src="https://your-server/share.html?id=xxx"> 引用
       */

      /**
       * 模拟从后端获取分享配置
       * 实际项目中替换为你自己的接口，例如：
       * fetch('/api/share/config?id=' + shareId, { headers: { Authorization: '...' } })
       */
      function fetchShareConfig() {
        // ===== 替换为你的后端接口调用 =====
        return Promise.resolve({
          url: 'ezopen://open.ys7.com/{deviceSerial}/{channelNo}.rec?begin=YYYYMMDDhhmmss&end=YYYYMMDDhhmmss',
          accessToken: 'your_access_token',
          playbackRange: {
            begin: '20260819103500', // 区间开始时间 YYYYMMDDhhmmss
            end: '20260819104500', // 区间结束时间 YYYYMMDDhhmmss
          },
        });
      }

      fetchShareConfig().then(function (config) {
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || document.documentElement.clientWidth <= 820;

        var player = new EZUIKit.EZUIKitPlayer({
          id: 'player',
          url: config.url,
          accessToken: config.accessToken,
          staticPath: './ezuikit_static',

          // 播放区间 —— 限制回放只能在该时间范围内播放
          playbackRange: config.playbackRange,

          width: isMobile ? document.documentElement.clientWidth : 800,
          height: isMobile ? (document.documentElement.clientWidth * 9) / 16 : 450,
          language: 'zh',
          scaleMode: 1, // 默认 0 完全填充窗口，会有拉伸 1: 等比适配 2: 等比完全填充窗口, 超出隐藏 @sine 8.2.0

          // 精简工具栏（适合嵌入场景）
          themeData: {
            autoFocus: 0,
            header: {
              btnList: [{ iconId: 'recDropdown', part: 'right', isrender: 1 }],
            },
            footer: {
              btnList: [
                { iconId: 'play', part: 'left', isrender: 1 },
                { iconId: 'sound', part: 'left', isrender: 1 },
                { iconId: 'expend', part: 'right', isrender: 1 },
              ],
            },
          },

          // 移动端扩展控件
          mobileExtendOptions: isMobile ? { controls: ['timeLine', 'segmentProgress'] } : null,

          // 关闭不需要的控件
          dateOptions: null,
          ptzOptions: null,
          talkOptions: null,
          recListOptions: null,
          recordOptions: null,
          capturePictureOptions: null,
          definitionOptions: null,
          deviceOptions: null,
          globalFullscreenOptions: null,
          alarmMessageOptions: null,
          dblClickFullscreen: false,
        });

        // 播放区间结束回调
        player.on(EZUIKit.EZUIKitPlayer.EVENTS.playbackEnd, function (data) {
          console.log('播放区间结束', data.reason, data.range);
        });

        // 页面卸载前销毁播放器，避免内存泄漏
        window.addEventListener('beforeunload', function () {
          if (player) {
            player.destroy();
            player = null;
          }
        });
      });
    </script>
  </body>
</html>
